<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gong of Fortune</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700;900&family=Ma+Shan+Zheng&display=swap">
<style>
/* Layout: one fixed-size stage (portrait 540x1160 or landscape 1600x900) scaled to fit; cabinet-style vertical stack per the deck mockups. */
:root {
  --ink: #14040a;
  --lacquer: #7c0f18;
  --lacquer-deep: #3a060c;
  --gold: #f2c14e;
  --gold-hi: #fff1bd;
  --gold-lo: #94600f;
  --jade: #46d394;
  --text: #fbecd0;
  --muted: #d9b98a;
  --fs-tint: #2a0830;
  --display: "Cinzel Decorative", "Cinzel", Georgia, serif;
  --ui: "Cinzel", Georgia, "Times New Roman", serif;
  --han: "Ma Shan Zheng", "STKaiti", "KaiTi", serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font-family: var(--ui); overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; overflow: hidden; overflow: clip; }
#bg { position: absolute; inset: -40px; background: var(--ink) center/cover no-repeat; filter: blur(18px) brightness(.45) saturate(1.2); }
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#game { position: absolute; inset: 0; overflow: hidden; overflow: clip; border-radius: 18px;
  background:
    radial-gradient(60% 34% at 50% 15%, rgba(255, 190, 90, .30), transparent 70%),
    radial-gradient(90% 60% at 50% 100%, rgba(150, 20, 30, .55), transparent 70%),
    repeating-radial-gradient(circle at 0 0, transparent 0 22px, rgba(242, 193, 78, .045) 22px 24px),
    linear-gradient(180deg, #3d0710 0%, #24040b 55%, #12030a 100%);
  transition: background .8s; }
#stage.fs #game { background:
    radial-gradient(70% 36% at 50% 14%, rgba(255, 120, 200, .25), transparent 70%),
    radial-gradient(90% 60% at 50% 100%, rgba(255, 140, 40, .35), transparent 70%),
    repeating-radial-gradient(circle at 100% 0, transparent 0 22px, rgba(255, 210, 120, .05) 22px 24px),
    linear-gradient(180deg, #3a0a3c 0%, #250621 55%, #12030f 100%); }
#game.shake { animation: shake .5s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake { 10%,90% { transform: translate(-3px, 1px); } 20%,80% { transform: translate(6px, -2px); } 30%,50%,70% { transform: translate(-9px, 3px); } 40%,60% { transform: translate(9px, -3px); } }
.box { position: absolute; }

/* ---------- logo ---------- */
#logo { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
  background: linear-gradient(180deg, #a3141f, #5a0810); border: 3px solid var(--gold); border-radius: 999px;
  box-shadow: 0 0 0 2px var(--lacquer-deep), 0 6px 18px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.18); }
#logo .l1 { font-family: var(--display); font-weight: 900; font-size: 34px; letter-spacing: .06em;
  background: linear-gradient(180deg, #fffbe0 0%, #ffd45a 45%, #b9780f 75%, #ffe38a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 #4a0a05); }
#logo .l2 { font-family: var(--ui); font-weight: 700; font-size: 12px; letter-spacing: .5em; color: var(--gold-hi); margin-top: 3px; padding-left: .5em; }
.landscape #logo .l1 { font-size: 38px; }

/* ---------- top: gong / quick hit ---------- */
#top { display: flex; align-items: center; justify-content: center; z-index: 2; }
#gongWrap { position: relative; }
#gongCv { position: absolute; inset: 0; width: 100%; height: 100%; }
#gongWrap.hit { animation: gongHit .9s ease-out; }
@keyframes gongHit { 0% { transform: rotate(0) scale(1); } 15% { transform: rotate(-4deg) scale(1.06); } 35% { transform: rotate(3deg) scale(.98); } 55% { transform: rotate(-2deg) scale(1.02); } 75% { transform: rotate(1deg); } 100% { transform: rotate(0) scale(1); } }
#gongWrap.tap { animation: gongTap .35s ease-out; }
@keyframes gongTap { 40% { transform: scale(1.05); } }
#gongText { position: absolute; left: 50%; top: 57%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; color: #4a1306;
  text-shadow: 0 1px 0 rgba(255, 245, 200, .55); pointer-events: none; text-align: center; }
#gongText .g1 { font-family: var(--ui); font-weight: 900; font-size: calc(var(--gs) * .075); letter-spacing: .12em; border-bottom: 2px solid rgba(74, 19, 6, .7); padding: 0 .2em 1px; }
#gongCount { font-family: var(--ui); font-weight: 900; font-size: calc(var(--gs) * .25); line-height: 1; margin-top: calc(var(--gs) * .01); font-variant-numeric: tabular-nums; }
#gongText .g2 { font-family: var(--ui); font-weight: 900; font-size: calc(var(--gs) * .06); letter-spacing: .06em; }
#top.forward { z-index: 26; }
#meter { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; height: 100%; padding: 2px 0; }
#meter[hidden] { display: none !important; }
.tier { flex: 1; display: flex; align-items: center; justify-content: center; gap: .55em; border-radius: 999px; min-height: 0;
  background: linear-gradient(180deg, #4b1218, #2a070c); border: 2px solid #b0313b; color: #f6dcb4;
  font-weight: 900; font-size: 21px; font-variant-numeric: tabular-nums; transition: background .3s, border-color .3s, box-shadow .3s; position: relative; }
.landscape .tier { font-size: 28px; }
.tier .mult { min-width: 3.2em; text-align: right; }
.tier .need { display: inline-flex; align-items: center; gap: .25em; min-width: 2.6em; }
.tier .need img { width: 1.25em; height: 1.25em; border-radius: 50%; }
.tier.reached { background: linear-gradient(180deg, #ffe48a, #c98a1c); border-color: var(--gold-hi); color: #4a1306; }
.tier.top { box-shadow: 0 0 18px 4px rgba(255, 200, 80, .75); }
.tier.next { border-color: var(--gold); animation: nextPulse 1.2s ease-in-out infinite; }
@keyframes nextPulse { 50% { box-shadow: 0 0 14px 2px rgba(242, 193, 78, .6); } }
.tier.flash { animation: tierFlash .7s ease-out; }
@keyframes tierFlash { 0% { transform: scale(1.12); box-shadow: 0 0 40px 12px rgba(255, 230, 140, .95); } 100% { transform: scale(1); } }
#meterLegend { display: flex; justify-content: space-between; width: 100%; font-size: 13px; font-weight: 700; color: var(--gold-hi); letter-spacing: .08em; padding: 0 6px; }
.landscape #meterLegend { font-size: 16px; }
#meterLegend img { width: 18px; height: 18px; vertical-align: -4px; border-radius: 50%; }

/* ---------- reels ---------- */
#reelFrame { padding: 8px; border-radius: 16px;
  background: linear-gradient(135deg, #fff0b0, #d69a2a 25%, #8a560c 50%, #f5cd62 75%, #9a6412);
  box-shadow: 0 0 0 3px var(--lacquer-deep), 0 14px 40px rgba(0,0,0,.6), 0 0 60px rgba(255, 170, 60, .18); }
#reelFrame::before, #reelFrame::after { content: ""; position: absolute; width: 26px; height: 26px; border-radius: 50%; top: -10px;
  background: radial-gradient(circle at 35% 35%, #fff6cf, #e0a634 55%, #7a4c08); box-shadow: 0 2px 4px rgba(0,0,0,.5); }
#reelFrame::before { left: -10px; } #reelFrame::after { right: -10px; }
#reelCv { display: block; width: 474px; height: 474px; border-radius: 10px; background: #1d0307; }
#reelFrame.antic { animation: antic .5s ease-in-out infinite alternate; }
@keyframes antic { to { box-shadow: 0 0 0 3px var(--lacquer-deep), 0 0 50px 14px rgba(255, 210, 90, .8); } }

/* ---------- info bar ---------- */
#infoBar { display: flex; align-items: center; justify-content: center; padding: 0 18px; border-radius: 10px;
  background: linear-gradient(180deg, #b01a25, #6a0a12); border: 2px solid var(--gold); box-shadow: 0 0 0 2px var(--lacquer-deep), inset 0 2px 0 rgba(255,255,255,.15);
  font-weight: 700; font-size: 17px; letter-spacing: .06em; color: var(--gold-hi); text-align: center; white-space: nowrap; overflow: hidden; }
#infoText { overflow: hidden; text-overflow: ellipsis; }
#infoText b { color: #fff; }
.landscape #infoBar { font-size: 19px; }

/* ---------- controls ---------- */
button { font-family: var(--ui); font-weight: 900; color: var(--gold-hi); cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
button:disabled { cursor: default; filter: grayscale(.7) brightness(.6); }
#spinRow { display: flex; align-items: center; justify-content: center; gap: 30px; }
#spinBtn { width: 104px; height: 104px; border-radius: 50%; font-size: 25px; letter-spacing: .04em;
  background: radial-gradient(circle at 40% 32%, #ff6a5a, #c0141f 45%, #6a0610 100%);
  border: 5px solid var(--gold); box-shadow: 0 0 0 3px var(--lacquer-deep), 0 8px 20px rgba(0,0,0,.6), inset 0 3px 0 rgba(255,255,255,.3), 0 0 26px rgba(255, 140, 60, .35);
  text-shadow: 0 2px 0 #4a0505; transition: transform .1s; }
#spinBtn:active { transform: scale(.95); }
#spinBtn.stop { background: radial-gradient(circle at 40% 32%, #ffd27a, #c98a1c 50%, #6a4006 100%); color: #3a0a04; text-shadow: none; }
.landscape #spinBtn { width: 150px; height: 150px; font-size: 34px; }
.rnd { width: 52px; height: 52px; border-radius: 50%; font-size: 30px; line-height: 1;
  background: radial-gradient(circle at 40% 32%, #5a1a1f, #24060a); border: 3px solid var(--gold); box-shadow: 0 0 0 2px var(--lacquer-deep), 0 4px 10px rgba(0,0,0,.5); }
#spinRow .pm { display: contents; }
.landscape #spinRow { gap: 36px; }
#minus { order: 0; } #spinBtn { order: 1; } #plus { order: 2; }
#btnRow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#btnRow .mid { display: flex; gap: 8px; }
.pill { height: 40px; padding: 0 14px; border-radius: 999px; font-size: 15px; letter-spacing: .04em;
  background: linear-gradient(180deg, #a3141f, #5a0810); border: 2px solid var(--gold); box-shadow: 0 0 0 2px var(--lacquer-deep); }
.pill.on { background: linear-gradient(180deg, #ffe48a, #c98a1c); color: #4a1306; }
.circ { width: 46px; height: 46px; border-radius: 50%; font-size: 14px;
  background: linear-gradient(180deg, #a3141f, #5a0810); border: 2px solid var(--gold); box-shadow: 0 0 0 2px var(--lacquer-deep); }
.burger { display: inline-flex; flex-direction: column; gap: 4px; align-items: center; }
.burger i { display: block; width: 20px; height: 3px; border-radius: 2px; background: var(--gold-hi); }
.landscape .pill { height: 50px; font-size: 19px; padding: 0 22px; }
.landscape .circ { width: 56px; height: 56px; font-size: 16px; }
#meters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mtr { display: flex; align-items: baseline; justify-content: center; gap: 6px; border-radius: 8px; padding: 0 8px; min-width: 0;
  background: linear-gradient(180deg, rgba(20, 3, 6, .85), rgba(50, 8, 14, .85)); border: 1px solid rgba(242, 193, 78, .55); white-space: nowrap; overflow: hidden; }
.mtr label { font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--muted); }
.mtr b { font-size: 19px; font-weight: 900; color: var(--gold-hi); font-variant-numeric: tabular-nums; }
.mtr small { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mtr { align-items: center; }
.mtr .stack { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.landscape .mtr label { font-size: 14px; } .landscape .mtr b { font-size: 28px; } .landscape .mtr small { font-size: 14px; }
#paySide { display: none; }
.landscape #paySide { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 18px; align-content: start; }
.payRow { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 19px; color: var(--gold-hi); font-variant-numeric: tabular-nums; }
.payRow img { width: 52px; height: 52px; }
#paySide h3 { grid-column: 1 / -1; margin: 0 0 2px; font-size: 14px; letter-spacing: .2em; color: var(--muted); text-align: center; font-weight: 700; }

/* ---------- overlays ---------- */
#fx { position: absolute; left: 0; top: 0; z-index: 30; pointer-events: none; }
#dim { position: absolute; inset: 0; background: rgba(8, 1, 4, .72); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .4s; }
#dim.on { opacity: 1; pointer-events: auto; }
#banner { position: absolute; left: 0; right: 0; z-index: 35; display: flex; flex-direction: column; align-items: center; pointer-events: none; opacity: 0; }
#banner .bt { font-family: var(--display); font-weight: 900; font-size: 62px; line-height: 1;
  background: linear-gradient(180deg, #fffbe0, #ffd45a 45%, #b9780f 75%, #ffe38a); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 0 #5a0a05) drop-shadow(0 0 22px rgba(255, 170, 40, .8)); }
#banner .bn { font-weight: 900; font-size: 46px; color: #fff; text-shadow: 0 3px 0 #6a0a05, 0 0 18px rgba(255, 190, 80, .9); font-variant-numeric: tabular-nums; }
#banner.show { animation: banner 2.4s ease-out forwards; }
@keyframes banner { 0% { opacity: 0; transform: scale(.4); } 12% { opacity: 1; transform: scale(1.1); } 20% { transform: scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: scale(1.04); } }
#popup { position: absolute; z-index: 40; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(440px, 86%); text-align: center;
  padding: 30px 26px 26px; border-radius: 22px; background: radial-gradient(120% 80% at 50% 0%, #b0182a, #5a0810 60%, #2a040a);
  border: 4px solid var(--gold); box-shadow: 0 0 0 4px var(--lacquer-deep), 0 0 0 7px rgba(242, 193, 78, .5), 0 30px 80px rgba(0,0,0,.7); }
#popup.in { animation: popIn .45s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes popIn { from { transform: translate(-50%, -50%) scale(.5); opacity: 0; } }
#popup .pt { font-family: var(--display); font-weight: 900; font-size: 30px; color: var(--gold-hi); letter-spacing: .04em; text-wrap: balance; }
#popup .pb { font-weight: 900; font-size: 84px; line-height: 1.05; margin: 8px 0 4px; font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, #fffbe0, #ffd45a 45%, #b9780f 75%, #ffe38a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #4a0a05); }
#popup .ps { font-family: var(--ui); font-weight: 500; font-size: 16px; line-height: 1.45; color: var(--text); text-wrap: balance; margin: 0 auto; max-width: 34ch; }
#popup .ps b { color: var(--gold-hi); }
#popup .pbtn { margin-top: 20px; height: 54px; padding: 0 40px; border-radius: 999px; font-size: 21px; letter-spacing: .1em;
  background: linear-gradient(180deg, #ffe48a, #c98a1c); color: #4a1306; border: 3px solid var(--gold-hi); box-shadow: 0 0 0 3px var(--lacquer-deep), 0 0 24px rgba(255, 200, 80, .6); animation: nextPulse 1.2s infinite; }
#panel { position: absolute; z-index: 45; inset: 16px; display: flex; flex-direction: column; border-radius: 18px; overflow: hidden;
  background: linear-gradient(180deg, #3d0710, #1a0308); border: 3px solid var(--gold); box-shadow: 0 0 0 3px var(--lacquer-deep), 0 30px 80px rgba(0,0,0,.7); }
#panelHead { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid rgba(242, 193, 78, .4); background: rgba(0,0,0,.25); }
#panelFoot { padding: 12px 16px; border-top: 1px solid rgba(242, 193, 78, .4); background: rgba(0,0,0,.25); display: flex; justify-content: center; }
#panelHead h2 { margin: 0; font-family: var(--display); font-size: 22px; color: var(--gold-hi); }
#panelBody { overflow-y: auto; padding: 16px 18px 24px; font-family: var(--ui); font-weight: 500; font-size: 15px; line-height: 1.5; color: var(--text); user-select: text; -webkit-user-select: text; }
#panelBody h3 { font-size: 14px; letter-spacing: .18em; color: var(--gold); margin: 20px 0 8px; font-weight: 700; }
#panelBody h3:first-child { margin-top: 0; }
#panelBody p { margin: 0 0 8px; max-width: 62ch; }
.ptGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.ptCell { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; background: rgba(0,0,0,.25); border: 1px solid rgba(242,193,78,.25); }
.ptCell img { width: 56px; height: 56px; flex: none; }
.ptCell div { display: flex; flex-direction: column; line-height: 1.2; }
.ptCell b { font-weight: 900; color: var(--gold-hi); font-size: 18px; font-variant-numeric: tabular-nums; }
.ptCell span { font-size: 12px; color: var(--muted); }
.lines { display: flex; gap: 12px; flex-wrap: wrap; }
.mini { display: grid; grid-template-columns: repeat(3, 14px); gap: 2px; padding: 5px; border-radius: 6px; background: rgba(0,0,0,.3); position: relative; }
.mini i { width: 14px; height: 14px; border-radius: 2px; background: rgba(255,255,255,.12); }
.mini i.on { background: var(--gold); }
.mini em { position: absolute; top: -8px; left: -8px; width: 18px; height: 18px; border-radius: 50%; background: var(--lacquer); border: 1px solid var(--gold); font-style: normal; font-size: 11px; font-weight: 900; display: grid; place-items: center; color: var(--gold-hi); }
table.tiers { border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.tiers td { padding: 3px 14px 3px 0; }
table.tiers td:last-child { color: var(--gold-hi); font-weight: 900; }
.menuList { display: flex; flex-direction: column; gap: 10px; }
.menuList button { text-align: left; height: 48px; padding: 0 16px; border-radius: 12px; font-size: 16px; letter-spacing: .03em;
  background: linear-gradient(180deg, #6a0d16, #3a060c); border: 2px solid rgba(242, 193, 78, .6); display: flex; align-items: center; justify-content: space-between; }
.menuList button .st { font-size: 13px; color: var(--muted); }
.menuList button.on .st { color: var(--jade); }
.volRow { display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 16px; border-radius: 12px; font-weight: 900; font-size: 16px; letter-spacing: .03em; color: var(--gold-hi);
  background: linear-gradient(180deg, #6a0d16, #3a060c); border: 2px solid rgba(242, 193, 78, .6); }
.volRow input { flex: 1; min-width: 0; accent-color: var(--gold); height: 28px; }
.volRow .st { font-size: 13px; color: var(--muted); min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
pre#resp { white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.4; background: rgba(0,0,0,.4); padding: 10px; border-radius: 8px; color: #f3dcb6; max-height: 320px; overflow: auto; margin: 0; }
.note { font-size: 13px; color: var(--muted); }

/* ---------- title ---------- */
#title { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; cursor: pointer;
  background: var(--ink) center/cover no-repeat; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 max(7vh, env(safe-area-inset-bottom, 0px)); }
#title::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(10, 2, 5, .85)); }
#title .tap { position: relative; font-family: var(--display); font-weight: 900; font-size: clamp(22px, 5vmin, 40px); color: var(--gold-hi); letter-spacing: .12em; text-shadow: 0 3px 0 #5a0a05, 0 0 20px rgba(255, 170, 40, .9); animation: tapPulse 1.4s ease-in-out infinite; }
#title .sub { position: relative; margin-top: 8px; font-size: clamp(12px, 2vmin, 15px); letter-spacing: .2em; color: var(--muted); }
#title.out { opacity: 0; transition: opacity .6s; pointer-events: none; }
@keyframes tapPulse { 50% { transform: scale(1.06); opacity: .85; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ---------- positions ---------- */
.portrait { width: 540px; height: 1160px; }
.portrait #logo { left: 110px; top: 12px; width: 320px; height: 62px; }
.portrait #top { left: 50px; top: 80px; width: 440px; height: 296px; }
.portrait #reelFrame { left: 25px; top: 386px; width: 490px; height: 490px; }
.portrait #infoBar { left: 25px; top: 890px; width: 490px; height: 46px; }
.portrait #spinRow { left: 0; top: 946px; width: 540px; height: 110px; }
.portrait #btnRow { left: 18px; top: 1060px; width: 504px; height: 50px; }
.portrait #meters { left: 18px; top: 1114px; width: 504px; height: 36px; }
.landscape { width: 1600px; height: 900px; }
.landscape #logo { left: 590px; top: 10px; width: 420px; height: 68px; }
.landscape #top { left: 60px; top: 100px; width: 460px; height: 540px; }
.landscape #reelFrame { left: 555px; top: 96px; width: 490px; height: 490px; }
.landscape #infoBar { left: 555px; top: 600px; width: 490px; height: 50px; }
.landscape #spinRow { left: 1100px; top: 110px; width: 440px; height: 260px; }
.landscape #paySide { left: 1110px; top: 400px; width: 420px; height: 250px; }
.landscape #btnRow { left: 240px; top: 686px; width: 1120px; height: 60px; }
.landscape #meters { left: 140px; top: 770px; width: 1320px; height: 74px; gap: 16px; }
</style>

</head><body>
<div id="app">
  <div id="bg"></div>
  <div id="stage" class="portrait">

<script>
(() => {
'use strict';
// ===================== GAME ENGINE ("server") =====================
// Pure logic: RNG outcome, Gong collection, Free Spins, Quick Hit, wins.
// Mirrors the deck's server response fields (balance, bet_amount, reel_matrix,
// win_amount, gong_state, free_spin_state).
const S = { J: 0, Q: 1, K: 2, A: 3, INGOT: 4, LANTERN: 5, DRAGON: 6, WILD: 7, SCATTER: 8 };
const SYMBOL_NAMES = ['J', 'Q', 'K', 'A', 'Jade Ingot', 'Lantern', 'Golden Dragon', 'Phoenix Wild', 'Gong Scatter'];
// 3-of-a-kind payouts in multiples of the LINE bet (total bet / 5)
const PAYS = [8, 10, 14, 18, 25, 40, 80, 150, 0];
const LINES = [[1, 1, 1], [0, 0, 0], [2, 2, 2], [0, 1, 2], [2, 1, 0]];
const TIERS = [
  { wilds: 4, mult: 3 }, { wilds: 5, mult: 4 }, { wilds: 6, mult: 5 }, { wilds: 7, mult: 10 },
  { wilds: 8, mult: 25 }, { wilds: 9, mult: 50 }, { wilds: 10, mult: 100 },
];
const GONG_MIN = 5, GONG_MAX = 30, MAX_WIN_X = 1500;
//                      J   Q   K   A  ING LAN DRG WILD
const W_BASE = [11, 10, 9, 8, 6, 5, 3, 2];
const W_FS   = [12, 11, 10, 9, 7, 6, 4, 1.5];
const SCATTER_CHANCE = 0.19;          // per reel, max one scatter per reel
const GONG_STEP = [[0, 92], [1, 6.5], [2, 1.5]]; // extra spins per collected scatter

function pickW(rng, w) {
  let t = 0; for (const x of w) t += x;
  let r = rng() * t;
  for (let i = 0; i < w.length; i++) { r -= w[i]; if (r < 0) return i; }
  return w.length - 1;
}

function evalLines(m, lineBet) {
  const wins = [];
  LINES.forEach((ln, li) => {
    const s = ln.map((r, c) => m[c][r]);
    if (s.includes(S.SCATTER)) return;
    let target = s.find(x => x !== S.WILD);
    if (target === undefined) target = S.WILD;
    if (s.every(x => x === target || x === S.WILD)) {
      wins.push({ line: li + 1, symbol: target, count: 3, amount: PAYS[target] * lineBet,
        positions: ln.map((r, c) => [c, r]) });
    }
  });
  return wins;
}

function tierFor(wilds) {
  let t = -1;
  TIERS.forEach((x, i) => { if (wilds >= x.wilds) t = i; });
  return t;
}

function makeState(balance, bet) {
  return { balance, bet, gong: GONG_MIN, fs: null };
}

// opts.force: 'fs' (3 scatters) | 'tease' (2 scatters, miss on reel 3)
function serverSpin(state, rng, opts = {}) {
  if (state.mode === 'script') return scriptSpin(state, rng, opts);
  const bet = state.bet, lineBet = bet / 5;
  const res = { bet_amount: bet };
  const inFS = !!state.fs;
  if (!inFS) state.balance -= bet;

  const m = [];
  for (let c = 0; c < 3; c++) {
    const col = [];
    for (let r = 0; r < 3; r++) col.push(pickW(rng, inFS ? W_FS : W_BASE));
    m.push(col);
  }
  const scat = [];
  if (!inFS) {
    for (let c = 0; c < 3; c++) {
      let place = rng() < SCATTER_CHANCE;
      if (opts.force === 'fs') place = true;
      if (opts.force === 'tease') place = c < 2;
      if (place) { const r = Math.floor(rng() * 3); m[c][r] = S.SCATTER; scat.push([c, r]); }
    }
  }
  res.reel_matrix = m;
  const wins = evalLines(m, lineBet);
  let lineWin = wins.reduce((a, w) => a + w.amount, 0);
  res.win_breakdown = wins;

  if (!inFS) {
    const before = state.gong, incs = [];
    for (let i = 0; i < scat.length; i++) {
      const inc = GONG_STEP[pickW(rng, GONG_STEP.map(x => x[1]))][0];
      incs.push(inc);
      state.gong = Math.min(GONG_MAX, state.gong + inc);
    }
    res.scatter_count = scat.length;
    res.scatter_positions = scat;
    res.gong_state = { before, increments: incs, after: state.gong };
    res.free_spins_trigger = scat.length === 3;
    if (res.free_spins_trigger) {
      res.free_spins_awarded = state.gong;
      state.fs = { spins_left: state.gong, spins_total: state.gong, wild_count: 0, tier: -1, feature_win: 0 };
      state.gong = GONG_MIN;
      res.gong_state.reset_to = GONG_MIN;
    }
    lineWin = Math.min(lineWin, bet * MAX_WIN_X);
    state.balance += lineWin;
    res.win_amount = lineWin;
  } else {
    const fs = state.fs;
    const wp = [];
    m.forEach((col, c) => col.forEach((s, r) => { if (s === S.WILD) wp.push([c, r]); }));
    const tierBefore = fs.tier;
    fs.wild_count += wp.length;
    fs.tier = tierFor(fs.wild_count);
    fs.feature_win += lineWin;
    fs.spins_left -= 1;
    res.win_amount = lineWin;
    res.wild_positions = wp;
    res.tier_up = fs.tier > tierBefore;
    if (fs.spins_left <= 0) {
      const mult = fs.tier >= 0 ? TIERS[fs.tier].mult : 1;
      const total = Math.min(fs.feature_win * mult, bet * MAX_WIN_X);
      state.balance += total;
      res.feature_complete = { base_win: fs.feature_win, multiplier: mult, total, capped: fs.feature_win * mult > total };
      state.fs = null;
    }
  }
  res.free_spin_state = state.fs ? { ...state.fs, multiplier: state.fs.tier >= 0 ? TIERS[state.fs.tier].mult : 1 } : null;
  res.gong_meter = state.gong;
  res.balance = state.balance;
  return res;
}

// ===================== DEMO SCRIPT ENGINE =====================
// Scripted outcomes for the pitch demo (state.mode === 'script'):
// - Base spins run in cycles of 10: 6 non-winning, 3 symbol wins, 1 Free Spins trigger, in shuffled order.
//   Gong Scatters land on exactly 6 of the 10 (the trigger spin with 3, five others with 1 or 2).
// - Each cycle plans its feature up front: total Free Spins N decides the prize band
//   (5-8 FS -> 10-25x bet, 9-12 FS -> 26-100x, 13-20 FS -> 101-500x). Every feature pays 10x bet or more.
// - The Gong is steered so it holds the planned starting spins when the trigger lands.
//   The rest of N (always at least 1 spin) arrives during Free Spins: a Scatter reveals +1/+2/+3 spins, added at once.
// - The whole feature (every grid, the Quick Hit multiplier, the retriggers) is generated at the trigger.
const CYCLE = 10, SCRIPT_GONG_MAX = 19; // Gong stops at 19 so a feature can always add 1+ spins and stay within 20
const FS_PLANS = [
  { spins: [5, 8], prize: [10, 25], w: 70, mults: [[1, 40], [3, 30], [4, 18], [5, 12]] },
  { spins: [9, 12], prize: [26, 100], w: 24, mults: [[1, 15], [3, 25], [4, 20], [5, 20], [10, 20]] },
  { spins: [13, 20], prize: [101, 500], w: 6, mults: [[5, 30], [10, 35], [25, 22], [50, 10], [100, 3]] },
];
const ri = (rng, a, b) => a + Math.floor(rng() * (b - a + 1));
function shuffle(rng, a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const planForSpins = n => FS_PLANS.findIndex(p => n >= p.spins[0] && n <= p.spins[1]);
const winOf = (m, lineBet) => evalLines(m, lineBet).reduce((a, w) => a + w.amount, 0);

function planFeature(state, rng) {
  const g0 = Math.min(state.gong, SCRIPT_GONG_MAX);
  let p = pickW(rng, FS_PLANS.map(x => x.w));
  // every feature reveals at least 1 extra spin during Free Spins, so N >= starting spins + 1
  if (FS_PLANS[p].spins[1] < g0 + 1) p = FS_PLANS.findIndex(x => x.spins[1] >= g0 + 1);
  const N = ri(rng, Math.max(FS_PLANS[p].spins[0], GONG_MIN + 1, g0 + 1), FS_PLANS[p].spins[1]);
  return { N, S0: ri(rng, Math.max(GONG_MIN, g0), Math.min(N - 1, 12)) };
}
function newCycle(state, rng) {
  const types = shuffle(rng, ['trigger', 'win', 'win', 'win', 'lose', 'lose', 'lose', 'lose', 'lose', 'lose']);
  const others = shuffle(rng, types.map((t, i) => i).filter(i => types[i] !== 'trigger')).slice(0, 5);
  const scat = types.map((t, i) => t === 'trigger' ? 3 : others.includes(i) ? (rng() < 0.35 ? 2 : 1) : 0);
  state.script = { n: (state.script ? state.script.n : 0) + 1, types, scat, idx: 0, trigI: types.indexOf('trigger'), triggered: false, plan: planFeature(state, rng) };
}
// Gong increments for the Scatters of this spin: before the trigger they steer the Gong to the planned start.
function scriptIncs(state, rng, nScat) {
  const sc = state.script, incs = [];
  if (sc.triggered || sc.idx > sc.trigI) { for (let k = 0; k < nScat; k++) incs.push(rng() < 0.25 ? 1 : 0); return incs; }
  let D = Math.max(0, sc.plan.S0 - state.gong), L = 0;
  for (let i = sc.idx; i <= sc.trigI; i++) L += i === sc.idx ? nScat : sc.scat[i];
  for (let k = 0; k < nScat; k++) {
    const lo = Math.max(0, D - 3 * (L - 1)), hi = Math.min(3, D);
    let inc = Math.min(3, lo); if (hi > inc && rng() < (sc.idx === sc.trigI ? 0.7 : 0.4)) inc = ri(rng, inc + 1, hi);
    incs.push(inc); D -= inc; L--;
  }
  return incs;
}
function baseGrid(rng, nScat, kind, tease) {
  const reels = nScat === 3 ? [0, 1, 2] : tease ? [0, 1] : shuffle(rng, [0, 1, 2]).slice(0, nScat).sort();
  let best = null;
  for (let tries = 0; tries < 2000; tries++) {
    const m = [0, 1, 2].map(() => [0, 1, 2].map(() => pickW(rng, W_BASE)));
    const sp = reels.map(c => { const r = Math.floor(rng() * 3); m[c][r] = S.SCATTER; return [c, r]; });
    const a = winOf(m, 0.2);
    const ok = kind === 'win' ? a > 0 && a <= 30 : a === 0;
    if (ok) return { m, sp };
    if (!best) best = { m, sp };
  }
  return best;
}
// One Free Spins grid with exactly `wilds` Wilds, an optional Scatter, and a line win (in bet units) inside [lo, hi].
function fsGrid(rng, wilds, scatter, lo, hi) {
  let best = null, bd = Infinity;
  for (let tries = 0; tries < 700; tries++) {
    const m = [0, 1, 2].map(() => [0, 1, 2].map(() => pickW(rng, W_FS.slice(0, 7))));
    const cells = shuffle(rng, [0, 1, 2, 3, 4, 5, 6, 7, 8]); let p = 0, sp = null;
    if (scatter) { const q = cells[p++]; m[(q / 3) | 0][q % 3] = S.SCATTER; sp = [(q / 3) | 0, q % 3]; }
    for (let k = 0; k < wilds; k++) { const q = cells[p++]; m[(q / 3) | 0][q % 3] = S.WILD; }
    const a = winOf(m, 0.2), d = a < lo - 1e-9 ? lo - a : a > hi + 1e-9 ? a - hi : 0;
    if (d < bd) { bd = d; best = { m, sp, a }; if (d === 0) break; }
  }
  return best;
}
function buildFeature(rng, N, S0) {
  const plan = FS_PLANS[Math.max(0, planForSpins(N))];
  let last = null;
  for (let attempt = 0; attempt < 400; attempt++) {
    const X = plan.prize[0] + Math.pow(rng(), 1.5) * (plan.prize[1] - plan.prize[0]);
    const mult = plan.mults[pickW(rng, plan.mults.map(x => x[1]))][0];
    const W = mult === 1 ? ri(rng, 0, 3) : TIERS.find(t => t.mult === mult).wilds;
    const B = X / mult;
    const wl = new Array(N).fill(0);
    for (let k = 0; k < W; k++) { let i; do i = ri(rng, 0, N - 1); while (wl[i] >= 3); wl[i]++; }
    const awards = []; let E = N - S0; while (E > 0) { const a = Math.min(E, ri(rng, 1, 3)); awards.push(a); E -= a; }
    const rt = {}; let cur = S0, lp = -1;
    for (const a of awards) { const p = ri(rng, lp + 1, cur - 1); rt[p] = a; lp = p; cur += a; }
    const k = Math.max(1, Math.round(N * (0.35 + rng() * 0.25)));
    const winIdx = shuffle(rng, [...Array(N).keys()]).slice(0, k);
    const share = {}; let tot = 0; winIdx.forEach(i => { share[i] = 0.4 + rng(); tot += share[i]; });
    const spins = []; let base = 0;
    for (let i = 0; i < N; i++) {
      let lo = 0, hi = 0;
      if (share[i]) { const tg = B * share[i] / tot; lo = Math.max(1.6, tg * 0.6); hi = Math.max(lo + 0.5, tg * 1.5); }
      const g = fsGrid(rng, wl[i], !!rt[i], lo, hi); spins.push({ m: g.m, sp: g.sp, award: rt[i] || 0 }); base += g.a;
    }
    const total = base * mult;
    last = { N, S0, mult, wilds: W, base, total, spins };
    if (total >= plan.prize[0] - 1e-9 && total <= plan.prize[1] + 1e-9) return last;
  }
  return last;
}
function scriptSpin(state, rng, opts = {}) {
  if (state.fs) return scriptFS(state, rng);
  const bet = state.bet, lineBet = bet / 5, res = { bet_amount: bet };
  state.gong = Math.min(state.gong, SCRIPT_GONG_MAX);
  if (!state.script || state.script.idx >= CYCLE) newCycle(state, rng);
  const sc = state.script, i = sc.idx;
  if (opts.force === 'fs' && sc.types[i] !== 'trigger') {
    if (!sc.triggered && sc.trigI > i) {
      const ti = sc.trigI; [sc.types[i], sc.types[ti]] = [sc.types[ti], sc.types[i]]; [sc.scat[i], sc.scat[ti]] = [sc.scat[ti], sc.scat[i]]; sc.trigI = i;
    } else { sc.types[i] = 'trigger'; sc.scat[i] = 3; sc.trigI = i; sc.triggered = false; sc.plan = planFeature(state, rng); sc.extra = true; }
  }
  const type = sc.types[i], tease = opts.force === 'tease' && type !== 'trigger', nScat = tease ? 2 : sc.scat[i];
  state.balance -= bet;
  const g = baseGrid(rng, nScat, type, tease);
  const wins = evalLines(g.m, lineBet), lineWin = wins.reduce((a, w) => a + w.amount, 0);
  const before = state.gong, incs = scriptIncs(state, rng, nScat);
  incs.forEach(v => { state.gong = Math.min(SCRIPT_GONG_MAX, state.gong + v); });
  res.reel_matrix = g.m; res.win_breakdown = wins;
  res.scatter_count = g.sp.length; res.scatter_positions = g.sp;
  res.gong_state = { before, increments: incs, after: state.gong };
  res.free_spins_trigger = type === 'trigger';
  if (res.free_spins_trigger) {
    sc.triggered = true;
    const S0 = state.gong, N = Math.max(sc.plan.N, S0 + 1), f = buildFeature(rng, N, S0);
    res.free_spins_awarded = S0;
    state.fs = { spins_left: S0, spins_total: S0, wild_count: 0, tier: -1, feature_win: 0, script: f, i: 0 };
    state.gong = GONG_MIN; res.gong_state.reset_to = GONG_MIN;
  }
  state.balance += lineWin; res.win_amount = lineWin;
  res.script = { cycle: sc.n, cycle_spin: i + 1, of: CYCLE, type, scatter_spin: nScat > 0 };
  if (res.free_spins_trigger) res.script.feature_plan = { total_spins: state.fs.script.N, start_spins: state.fs.script.S0, prize_x_bet: +state.fs.script.total.toFixed(2), quick_hit: state.fs.script.mult };
  sc.idx++;
  res.free_spin_state = state.fs ? publicFS(state.fs) : null;
  res.gong_meter = state.gong; res.balance = state.balance;
  return res;
}
function publicFS(fs) { const { script, i, ...pub } = fs; return { ...pub, multiplier: fs.tier >= 0 ? TIERS[fs.tier].mult : 1 }; }
function scriptFS(state, rng) {
  const fs = state.fs, bet = state.bet, f = fs.script, sp = f.spins[fs.i++];
  const res = { bet_amount: bet, reel_matrix: sp.m };
  const wins = evalLines(sp.m, bet / 5), lineWin = wins.reduce((a, w) => a + w.amount, 0);
  const wp = []; sp.m.forEach((col, c) => col.forEach((s, r) => { if (s === S.WILD) wp.push([c, r]); }));
  const tierBefore = fs.tier; fs.wild_count += wp.length; fs.tier = tierFor(fs.wild_count);
  fs.feature_win += lineWin; fs.spins_left -= 1;
  res.win_breakdown = wins; res.win_amount = lineWin; res.wild_positions = wp; res.tier_up = fs.tier > tierBefore;
  res.fs_scatter = sp.award ? { position: sp.sp, award: sp.award } : null;
  if (sp.award) { fs.spins_left += sp.award; fs.spins_total += sp.award; }
  if (fs.spins_left <= 0) {
    const mult = fs.tier >= 0 ? TIERS[fs.tier].mult : 1, total = Math.min(fs.feature_win * mult, bet * MAX_WIN_X);
    state.balance += total;
    res.feature_complete = { base_win: fs.feature_win, multiplier: mult, total, capped: fs.feature_win * mult > total, spins_played: fs.spins_total };
    state.fs = null;
  }
  res.free_spin_state = state.fs ? publicFS(state.fs) : null;
  res.gong_meter = state.gong; res.balance = state.balance;

$('panelClose').addEventListener('click', closePanel);

$('spinBtn').addEventListener('click', () => { if (G.auto && G.phase !== 'spinning') { G.auto = false; hud(); return; } if (G.auto && G.phase === 'spinning') { G.auto = false; } trySpin(); hud(); });

  if (G.phase !== 'idle' || G.mode !== 'base') return;
  const old = DENOMS[G.denIdx]; G.denIdx = (G.denIdx + 1) % DENOMS.length; const nw = DENOMS[G.denIdx];
  G.st.balance = Math.floor(G.st.balance * old / nw); G.shownCredit = G.st.balance; hud(); setInfo(`DENOMINATION · <b>${$('bDenom').textContent}</b> PER CREDIT`); save();
});
$('minus').addEventListener('click', () => { if (G.betIdx > 0 && G.phase === 'idle') { G.betIdx--; hud(); save(); SND.betTick(G.betIdx); } });

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat && G.phase !== 'title') {
    if (!$('panel').hidden) return;
    e.preventDefault();
    if (!$('popup').hidden) { popRes && popRes(); return; }
    trySpin(); hud();
  }
  if (e.key === 'Escape') $('panel').hidden = true;
});

// ======================================================= LAYOUT / LOOP / BOOT
function layout() {
  const vw = innerWidth, vh = innerHeight; const land = vw / vh > 1.15;
  stageEl.className = (land ? 'landscape' : 'portrait') + (G.mode === 'fs' ? ' fs' : '');
  W = land ? 1600 : 540; H = land ? 900 : 1160;
  SCALE = Math.min(vw / W, vh / H);
  stageEl.style.width = W + 'px'; stageEl.style.height = H + 'px';
  stageEl.style.transform = `translate(${(vw - W * SCALE) / 2}px, ${(vh - H * SCALE) / 2}px) scale(${SCALE})`;
  FXK = Math.min(2, (devicePixelRatio || 1) * SCALE); fxCv.width = W * FXK; fxCv.height = H * FXK; fxCv.style.width = W + 'px'; fxCv.style.height = H + 'px';
  layoutGong();
}
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;

  if (gameEl.scrollTop || gameEl.scrollLeft) { gameEl.scrollTop = 0; gameEl.scrollLeft = 0; }
  requestAnimationFrame(loop);
}
async function boot(data) {

  await Promise.race([fontLoad, sleep(2500)]).catch(() => {});
  const saved = Object.assign(load(), data || {});
  G.st = makeState(Number.isFinite(saved.credits) && saved.credits > 0 ? saved.credits : 15000, 0);
  G.st.mode = 'script'; G.st.gong = clamp(saved.gong | 0 || 5, 5, 19);
  G.betIdx = Number.isInteger(saved.betIdx) ? clamp(saved.betIdx, 0, BETS.length - 1) : 3;
  G.denIdx = Number.isInteger(saved.denIdx) ? clamp(saved.denIdx, 0, DENOMS.length - 1) : 0;
  G.turbo = !!saved.turbo; if (saved.sound === false) SND.on = false; if (saved.music === false) SND.musicOn = false; if (Number.isFinite(saved.vol)) SND.vol = clamp(saved.vol, 0, 1);
  G.shownCredit = G.st.balance; G.gongShown = G.st.gong;
  buildTextures(); buildReelBg(); buildMeter();
  const m = []; for (let c = 0; c < 3; c++) m.push([0, 1, 2].map(() => (Math.random() * 7) | 0));
  m[0][1] = S.DRAGON; m[1][0] = S.LANTERN; m[2][2] = S.WILD;
  initReels(m);
  layout(); addEventListener('resize', layout);
  Object.defineProperty(G.st, 'bet', { get: () => BETS[G.betIdx] });
  hud(); requestAnimationFrame(loop);
  try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ credits: G.mode === 'base' ? G.st.balance : G.shownCredit, gong: G.st.gong, betIdx: G.betIdx, denIdx: G.denIdx, turbo: G.turbo })); } catch (e) {}
  const start = () => {
    if (G.phase !== 'title') return;
    SND.init(); SND.intro(); SND.setMode('base', 1.4); $('title').classList.add('out'); setTimeout(() => { $('title').hidden = true; }, 650);
    G.phase = 'idle'; hud(); $('spinBtn').focus({ preventScroll: true });
  };
  $('title').addEventListener('click', start);
  $('title').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); start(); } });
  window.__gof = { G, SND, start, trySpin, Reels, get dragon() { return dragonRun; } };
}
const hot = window.claude && window.claude.hot;
try { (hot && hot.ready) ? hot.ready(boot) : boot((hot && hot.data) || {}); } catch (e) { boot({}); }
})();
