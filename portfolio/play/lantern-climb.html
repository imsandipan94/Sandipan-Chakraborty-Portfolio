<style>
/* Layout: one portrait stage centered on the page; canvas fills it, DOM overlays for HUD and cards. */
:root {
  --night: #17122a;      /* page and sky */
  --dusk: #2a2147;       /* panels */
  --stone: #3d3360;
  --ink: #f4ead8;        /* text */
  --dim: #a99cc4;        /* secondary text */
  --ember: #ffb04a;      /* hero, accent */
  --thorn: #ff6f61;
  --spring: #58d6b5;
  --star: #ffe27a;

}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--night); color: var(--ink);
  font-family: var(--mono); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#stage {
  position: relative; height: 100%;

canvas { display: block; position: absolute; inset: 0; }

.hud {
  position: absolute; left: 0; right: 0; top: 0; z-index: 2;

.hud .lvl small { font-family: var(--mono); font-size: 11px; color: var(--dim); letter-spacing: .08em; margin-right: 6px; }
.hud .clock { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ember); }
.hud .falls { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.stars { display: inline-flex; gap: 2px; align-items: center; vertical-align: middle; }
.stars svg { display: block; }
.hud .stars { margin-top: 3px; justify-content: flex-end; }
.star-on { fill: var(--star); }

@keyframes pop { from { transform: scale(1.8); } }
.iconbtn {
  pointer-events: auto; width: 36px; height: 36px; border-radius: 10px; flex: none;
  border: 1px solid rgba(169,156,196,.3); background: rgba(42,33,71,.8); color: var(--ink);

}
.iconbtn:focus-visible, .btn:focus-visible, .lv:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

.overlay {
  position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column;
  justify-content: center; align-items: center; padding: 24px 20px; gap: 18px; text-align: center;

.logo { font-family: var(--display); font-size: clamp(48px, 15vw, 72px); line-height: .9; color: var(--ink); text-wrap: balance; text-shadow: 0 0 28px rgba(255,176,74,.45); }
.logo span { color: var(--ember); display: block; font-size: .5em; letter-spacing: .12em; margin-bottom: 6px; }
.tag { color: var(--dim); font-size: 12px; line-height: 1.6; max-width: 30ch; }

.card {

<script>
// Shared physics core: runs in the browser and in the Node solver.
// Units are tiles and seconds. y grows downward.
const P = {
  RUN: 4.4, G: 40, JUMP: 17.6, SLIDE: 3.0, BOUNCE: 23.5, MAXFALL: 17,
  W: 0.66, H: 0.78, COYOTE: 0.12, BUFFER: 0.18, DT: 1 / 120, DOUBLE: 0.85
};

function parseLevel(def) {
  const g = def.map.map(r => r.split(''));
  const h = g.length, w = g[0].length;
  let sx = 1, sy = h - 2, gx = 0, gy = 0;
  const gems = [];
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
    const ch = g[r][c];
    if (ch === 'S') { sx = c; sy = r; g[r][c] = '.'; }
    if (ch === 'G') { gx = c; gy = r; }
    if (ch === '*') { gems.push([c, r]); g[r][c] = '.'; }
  }
  return { name: def.name, hint: def.hint || '', g, w, h, sx, sy, gx, gy, gems };
}

function tileAt(L, c, r) {
  if (c < 0 || c >= L.w || r >= L.h) return '#';
  if (r < 0) return '.';
  return L.g[r][c];
}
const isSolid = ch => ch === '#' || ch === 'B';

function newHero(L) {
  return {
    x: L.sx + (1 - P.W) / 2, y: L.sy + 1 - P.H, vy: 0, dir: 1,
    ground: true, wall: 0, coy: 0, buf: 0, t: 0, face: 1, air: 1, drop: -1
  };
}

function overlapSolid(L, x, y) {
  const c0 = Math.floor(x), c1 = Math.floor(x + P.W - 1e-9);
  const r0 = Math.floor(y), r1 = Math.floor(y + P.H - 1e-9);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++)
    if (isSolid(tileAt(L, c, r))) return true;
  return false;
}

// Advance one fixed step. input:
//   0/false nothing   1/true jump (buffered; kicks off walls)   2 turn around
//   3 face left       4 face right                              5 jump, or double jump in mid-air
//   6 drop down through the wooden plank Wick is standing on
// Returns an event string or null: 'jump' | 'walljump' | 'bounce' | 'land' | 'dead' | 'win'
function step(s, L, input) {
  const dt = P.DT;
  let ev = null;
  s.t += dt;
  if (input === 2) { s.dir = -s.dir; s.wall = 0; ev = 'turn'; }
  else if (input === 3 || input === 4) {
    const d = input === 3 ? -1 : 1;
    if (s.dir !== d) { s.dir = d; if (s.wall && s.wall !== d) s.wall = 0; ev = 'turn'; }
  }
  else if (input === 5 && !s.ground && s.coy <= 0 && !s.wall && s.air > 0) {
    s.vy = -P.JUMP * P.DOUBLE; s.air = 0; s.buf = 0; ev = 'double';
  }
  else if (input === 6) {
    // only when every tile under Wick's feet is wood (stone and springs can't be dropped through)
    if (s.ground) {
      const r = Math.floor(s.y + P.H + 0.01), c0 = Math.floor(s.x), c1 = Math.floor(s.x + P.W - 1e-9);
      let wood = true; for (let c = c0; c <= c1; c++) if (tileAt(L, c, r) !== '-' && tileAt(L, c, r) !== '.') wood = false;
      let any = false; for (let c = c0; c <= c1; c++) if (tileAt(L, c, r) === '-') any = true;
      if (wood && any) { s.drop = r; s.ground = false; s.coy = 0; s.vy = 2; ev = 'drop'; }
    }
  }
  else if (input) s.buf = P.BUFFER;
  if (s.buf > 0) {
    if (s.ground || s.coy > 0) {
      s.vy = -P.JUMP; s.ground = false; s.coy = 0; s.buf = 0; ev = 'jump';
    } else if (s.wall) {
      s.vy = -P.JUMP; s.dir = -s.wall; s.wall = 0; s.buf = 0; ev = 'walljump';
    }
  }
  s.buf -= dt; s.coy -= dt;

  s.vy = Math.min(s.vy + P.G * dt, P.MAXFALL);
  if (s.wall && s.vy > P.SLIDE) s.vy = P.SLIDE;

  // Horizontal
  const wasGround = s.ground;
  s.x += s.dir * P.RUN * dt;
  let hit = false;
  if (overlapSolid(L, s.x, s.y)) {
    hit = true;
    if (s.dir > 0) s.x = Math.floor(s.x + P.W) - P.W - 1e-6;
    else s.x = Math.floor(s.x) + 1 + 1e-6;
  }
  if (hit) {
    if (wasGround) { s.dir = -s.dir; s.wall = 0; }
    else s.wall = s.dir;
  } else s.wall = 0;

  // Vertical
  const prevBottom = s.y + P.H;
  s.y += s.vy * dt;
  s.ground = false;
  if (s.vy > 0) {
    const r = Math.floor(s.y + P.H);
    const c0 = Math.floor(s.x), c1 = Math.floor(s.x + P.W - 1e-9);
    let land = false, bounce = false;
    for (let c = c0; c <= c1; c++) {
      const ch = tileAt(L, c, r);
      if (isSolid(ch) || (ch === '-' && prevBottom <= r + 1e-6 && r !== s.drop)) land = true;
      if (ch === 'B') bounce = true;
    }
    if (land) {
      s.y = r - P.H;
      if (bounce) { s.vy = -P.BOUNCE; ev = 'bounce'; s.wall = 0; }
      else { if (!wasGround) ev = ev || 'land'; s.vy = 0; s.ground = true; s.wall = 0; }
    }
  } else if (s.vy < 0) {
    const r = Math.floor(s.y);
    const c0 = Math.floor(s.x), c1 = Math.floor(s.x + P.W - 1e-9);
    for (let c = c0; c <= c1; c++) if (isSolid(tileAt(L, c, r))) {
      s.y = r + 1; s.vy = 0; break;
    }
  }
  if (wasGround && !s.ground && ev !== 'jump' && ev !== 'drop') s.coy = P.COYOTE;
  if (s.drop >= 0 && (s.y > s.drop + 0.05 || s.ground)) s.drop = -1;
  if (s.ground) s.coy = 0;
  if (s.ground || s.wall) s.air = 1;
  if (s.wall) s.face = -s.wall; else s.face = s.dir;

  // Hazards and goal
  const hx0 = s.x + 0.1, hx1 = s.x + P.W - 0.1, hy0 = s.y + 0.12, hy1 = s.y + P.H - 0.04;
  const c0 = Math.floor(hx0), c1 = Math.floor(hx1), r0 = Math.floor(hy0), r1 = Math.floor(hy1);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const ch = tileAt(L, c, r);
    if (ch === '^') {
      // inset spike box
      if (hx1 > c + 0.18 && hx0 < c + 0.82 && hy1 > r + 0.2 && hy0 < r + 0.8) return 'dead';
    } else if (ch === 'G') return 'win';
  }
  return ev;
}

// Star pickup: the hero's box overlaps the star's cell (inset so it reads as touching the star).
function starHit(s, c, r) {
  return s.x + P.W > c + 0.2 && s.x < c + 0.8 && s.y + P.H > r + 0.15 && s.y < r + 0.85;
}


</script>

    81,0,0,79,76,0,74,0,   77,0,0,0,76,0,74,0,   74,0,72,0,71,0,69,0,  71,0,0,0,68,0,0,0 ];

  ctx.fillStyle = COL.star; ctx.fill();
  ctx.lineWidth = Math.max(1, T * 0.04); ctx.strokeStyle = COL.starLo; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.beginPath(); ctx.arc(-R * 0.18, -R * 0.2, R * 0.13, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawSpring(c, r, a) {
  const x = c * T, y = r * T, comp = Math.sin(a * Math.PI) * 0.18;
  ctx.fillStyle = COL.stone; ctx.fillRect(x, y + T * 0.55, T, T * 0.45);
  ctx.fillStyle = COL.stoneHi; ctx.fillRect(x, y + T * 0.55, T, 2);
  ctx.strokeStyle = COL.coil; ctx.lineWidth = Math.max(1.5, T * 0.06);
  ctx.beginPath();
  const top = y + T * (0.2 + comp), bot = y + T * 0.55;
  for (let i = 0; i <= 4; i++) {
    const yy = top + (bot - top) * (i / 4);
    ctx.lineTo(x + T * (i % 2 ? 0.28 : 0.72), yy);
  }
  ctx.stroke();
  ctx.fillStyle = COL.springLo; roundRect(x + T * 0.06, top - T * 0.02, T * 0.88, T * 0.14, T * 0.05); ctx.fill();
  ctx.fillStyle = COL.spring; roundRect(x + T * 0.06, top - T * 0.1, T * 0.88, T * 0.13, T * 0.05); ctx.fill();
}

function drawLantern(time) {
  const x = L.gx * T, y = L.gy * T;
  ctx.fillStyle = COL.post; ctx.fillRect(x + T * 0.44, y + T * 0.55, T * 0.12, T * 0.45);
  ctx.fillRect(x + T * 0.3, y + T * 0.92, T * 0.4, T * 0.08);
  // lantern body
  const bob = Math.sin(time * 2) * T * 0.02;
  ctx.fillStyle = '#4a3d6a'; roundRect(x + T * 0.28, y + T * 0.05 + bob, T * 0.44, T * 0.08, 2); ctx.fill();
  const flick = 0.85 + Math.sin(time * 13) * 0.08 + Math.sin(time * 7.3) * 0.07;
  const glass = lit > 0 ? COL.glass : '#5e517f';
  ctx.fillStyle = glass; ctx.globalAlpha = lit > 0 ? flick : 1;
  roundRect(x + T * 0.31, y + T * 0.13 + bob, T * 0.38, T * 0.38, T * 0.08); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#4a3d6a'; ctx.lineWidth = 2;
  roundRect(x + T * 0.31, y + T * 0.13 + bob, T * 0.38, T * 0.38, T * 0.08); ctx.stroke();
  ctx.fillStyle = '#4a3d6a'; ctx.fillRect(x + T * 0.3, y + T * 0.5 + bob, T * 0.4, T * 0.06);
  if (!lit) { // waiting ember inside
    ctx.fillStyle = `rgba(255,176,74,${0.35 + 0.25 * Math.sin(time * 3)})`;
    ctx.beginPath(); ctx.arc(x + T * 0.5, y + T * 0.36 + bob, T * 0.06, 0, Math.PI * 2); ctx.fill();
  }
}

function drawHero(time) {
  const w = P.W * T, h = P.H * T;
  let sxs = 1 / Math.sqrt(squash), sys = squash;
  if (hero.wall && hero.vy > 0) { sxs = 0.92; sys = 1.04; }
  const cx = (hero.x + P.W / 2) * T, by = (hero.y + P.H) * T;
  ctx.save();
  ctx.translate(cx, by); ctx.scale(sxs, sys);
  // glow
  const gl = ctx.createRadialGradient(0, -h / 2, 0, 0, -h / 2, T * 1.3);
  gl.addColorStop(0, 'rgba(255,176,74,0.35)'); gl.addColorStop(1, 'rgba(255,176,74,0)');
  ctx.fillStyle = gl; ctx.fillRect(-T * 1.4, -h / 2 - T * 1.4, T * 2.8, T * 2.8);
  // flame tuft
  const f = Math.sin(time * 18) * 0.06, lean = -hero.face * 0.12;
  ctx.fillStyle = COL.emberLo; flame(-w * 0.18, -h * 0.92, w * 0.22, h * (0.38 + f), lean);
  ctx.fillStyle = COL.ember; flame(w * 0.05, -h * 0.95, w * 0.3, h * (0.55 - f), lean);
  ctx.fillStyle = COL.emberHi; flame(w * 0.05, -h * 0.92, w * 0.14, h * (0.3 + f), lean);
  // body
  ctx.fillStyle = COL.emberLo; roundRect(-w / 2, -h, w, h, w * 0.32); ctx.fill();
  ctx.fillStyle = COL.ember; roundRect(-w / 2, -h, w, h * 0.86, w * 0.32); ctx.fill();
  ctx.fillStyle = 'rgba(255,225,163,0.6)'; roundRect(-w * 0.36, -h * 0.9, w * 0.22, h * 0.18, w * 0.1); ctx.fill();
  // eyes
  const ex = hero.face * w * 0.12, blink = (time % 3.7) < 0.12 ? 0.15 : 1;
  ctx.fillStyle = COL.eye;
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(ex + s * w * 0.16, -h * 0.55, w * 0.07, h * 0.1 * blink, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function flame(x, y, w, h, lean) {
  ctx.beginPath();
  ctx.moveTo(x - w / 2, y + h * 0.15);
  ctx.quadraticCurveTo(x - w / 2, y - h * 0.4, x + lean * h, y - h);
  ctx.quadraticCurveTo(x + w / 2, y - h * 0.4, x + w / 2, y + h * 0.15);
  ctx.closePath(); ctx.fill();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

$('rules').innerHTML = SCHEME.rules.concat([['Stars', 'two hidden in each tower, one for the lantern']])
  .map(([k, v]) => `<div><b>${k}</b> ${v}</div>`).join('');
$('variantTag').textContent = `Build ${VARIANT} · ${SCHEME.label}`;

// read-only view of the run, used by automated tests
window.__lanternClimb = { variant: VARIANT, get audio() { return { ctx: AC ? AC.state : 'none', music: music.playing, level: musicOut ? +musicOut.gain.value.toFixed(2) : null, sound: save.sound }; }, get hero() { return hero; }, get state() { return state; }, get stars() { return got.slice(); }, get level() { return li; } };

// boot
setMute();
resize();
showTitle();
resize();
try { const wl = navigator.wakeLock && navigator.wakeLock.request('screen'); wl && wl.catch(() => {}); } catch (e) {}
requestAnimationFrame(frame);
})();
